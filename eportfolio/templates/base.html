<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ePortfolio{% endblock %} | Student Mental Health Analysis</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}"><span>e</span>Portfolio</a>
    <nav>
      <a href="{{ url_for('home') }}" class="{{ 'active' if page == 'home' }}">Home</a>
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if page == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('story') }}" class="{{ 'active' if page == 'story' }}">Story</a>
      <a href="{{ url_for('portfolio') }}" class="{{ 'active' if page == 'portfolio' }}">Portfolio</a>
    </nav>
  </header>

  <main class="{% block mainclass %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>Analysing Mental Health in Student Ecosystem &middot; Atharv Bhosale &middot; Data Analytics with Tableau capstone</p>
  </footer>
</body>
</html>
